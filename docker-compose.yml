services:
  # Banco de dados MySQL responsavel por armazenar os dados do WordPress.
  database:
    image: mysql:latest
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: sarah_emanuel
      MYSQL_PASSWORD: user
    volumes:
      - my:/var/lib/mysql
    networks:
      - wordpress

  # Container da aplicacao WordPress que se conecta ao banco de dados.
  webserver:
    image: wordpress:latest
    container_name: webserver
    restart: always
    depends_on:
      - database
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_USER: sarah_emanuel
      WORDPRESS_DB_PASSWORD: user
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - app:/var/www/html
    networks:
      - wordpress

  # Proxy Nginx que recebe o acesso externo e encaminha para o WordPress.
  webproxy:
    image: sarahusr/nginx-proxy:latest
    container_name: webproxy
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - webserver
    networks:
      - wordpress

# Volumes persistentes para manter dados do WordPress e do MySQL mesmo apos recriar containers.
volumes:
  app:
    name: app
  my:
    name: my

# Rede interna usada para permitir comunicacao entre banco, WordPress e proxy.
networks:
  wordpress:
    name: wordpress
